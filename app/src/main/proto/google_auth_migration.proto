// Format of record for `otpauth-migration://offline?data=…`, the export scheme used by
// Google Authenticator and compatible apps.
//
// The app does NOT compile this file: there is no protoc plugin and no protobuf runtime
// dependency. Parsing is done by the hand-written reader in
// app/src/main/java/com/mikhail/authenticator/migration/ProtobufReader.kt, which implements
// exactly the field numbers and enum values below. This file is kept so the wire format the
// code implements is stated in one place, in the standard notation.

syntax = "proto3";

package googleauth;

option java_package = "com.mikhail.authenticator.migration.proto";
option java_outer_classname = "GoogleAuthMigration";

message MigrationPayload {
  enum Algorithm {
    ALGORITHM_UNSPECIFIED = 0;
    ALGORITHM_SHA1 = 1;
    ALGORITHM_SHA256 = 2;
    ALGORITHM_SHA512 = 3;
    ALGORITHM_MD5 = 4;
  }

  enum DigitCount {
    DIGIT_COUNT_UNSPECIFIED = 0;
    DIGIT_COUNT_SIX = 1;
    DIGIT_COUNT_EIGHT = 2;
  }

  enum OtpType {
    OTP_TYPE_UNSPECIFIED = 0;
    OTP_TYPE_HOTP = 1;
    OTP_TYPE_TOTP = 2;
  }

  message OtpParameters {
    bytes secret = 1;
    string name = 2;
    string issuer = 3;
    Algorithm algorithm = 4;
    DigitCount digits = 5;
    OtpType type = 6;
    int64 counter = 7;
  }

  repeated OtpParameters otp_parameters = 1;
  int32 version = 2;
  int32 batch_size = 3;
  int32 batch_index = 4;
  int32 batch_id = 5;
}
