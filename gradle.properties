org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.workers.max=1
android.useAndroidX=true
kotlin.code.style=official
# compileSdk 37 ships as the SDK package android-37.0, which AGP 9.1 predates;
# without this line the build prints an "unsupported compileSdk" warning.
android.suppressUnsupportedCompileSdk=37.0
# No org.gradle.java.home here on purpose: a machine-specific path breaks CI and fresh clones.
# Gradle resolves its own JDK 21 toolchain (foojay), the launcher may be any JDK 17+.
