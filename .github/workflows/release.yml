name: Release APK

# Tag a commit (git tag v1.0.0 && git push origin v1.0.0) and a signed APK appears on the
# release. Signing happens inside Gradle with a keystore materialised from secrets — no
# third-party signing action is involved, so no third party ever sees the key material.

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      - name: Install Android SDK components
        run: |
          SDKMANAGER=$(ls -d $ANDROID_HOME/cmdline-tools/*/bin/sdkmanager | head -1)
          yes | "$SDKMANAGER" --channel=3 "platforms;android-37.0" "build-tools;37.0.0" || true
          if [ -d "$ANDROID_HOME/platforms/android-37.0" ]; then
            ln -sfn android-37.0 "$ANDROID_HOME/platforms/android-37"
          fi

      - name: Materialise the keystore from secrets
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${KEYSTORE_BASE64:-}" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set — the release APK will be unsigned."
            exit 0
          fi
          # A pasted trailing newline or space is the classic cause of
          # "keystore password was incorrect": trim every value before use.
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          STORE_PW="$(trim "${KEYSTORE_PASSWORD:-}")"
          KEY_PW="$(trim "${KEY_PASSWORD:-}")"
          ALIAS="$(trim "${KEY_ALIAS:-}")"
          printf '%s' "$KEYSTORE_BASE64" | tr -d '\r\n' | base64 -d > release.jks
          {
            echo "storeFile=release.jks"
            echo "storePassword=$STORE_PW"
            echo "keyAlias=$ALIAS"
            echo "keyPassword=$KEY_PW"
          } > keystore.properties
          echo "::notice::keystore restored ($(stat -c%s release.jks) bytes), alias '$ALIAS'"

      # Fails here with a plain explanation, instead of two minutes later inside R8 packaging
      # where the only clue is a KeytoolException from Gradle.
      - name: Check that the password opens the keystore
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ ! -s release.jks ]; then
            echo "::warning::no keystore was restored — signing will be skipped"; exit 0
          fi
          trim() { printf '%s' "$1" | tr -d '\r\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//'; }
          STORE_PW="$(trim "${KEYSTORE_PASSWORD:-}")"
          ALIAS="$(trim "${KEY_ALIAS:-}")"
          if ! keytool -list -keystore release.jks -storepass "$STORE_PW" >/dev/null 2>&1; then
            echo "::error::KEYSTORE_PASSWORD does not open the keystore uploaded as KEYSTORE_BASE64 — they must come from the same file (and without a trailing newline)."
            exit 1
          fi
          echo "::notice::store password is correct"
          if ! keytool -list -keystore release.jks -storepass "$STORE_PW" -alias "$ALIAS" >/dev/null 2>&1; then
            echo "::error::this keystore has no entry named '$ALIAS' (KEY_ALIAS). Use one of the names that 'keytool -list' prints for this file."
            exit 1
          fi
          echo "::notice::alias '$ALIAS' is present in the keystore"

      # The unit tests are variant-independent; AGP only creates a test<variant>UnitTest task
      # for variants that have their own test source set, so debug is the one that exists.
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest --console=plain

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --console=plain

      # Карта переименований R8. Без неё стек из релизной сборки не расшифровать: в сообщении
      # с телефона класс выглядит как `bv3`, а номер строки относится к исходному файлу. Кладём
      # всегда, в том числе при падении сборки — именно тогда она нужнее всего.
      - name: Upload the R8 mapping
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: r8-mapping-${{ github.ref_name }}
          path: app/build/outputs/mapping/release/mapping.txt
          if-no-files-found: warn

      - name: Verify signature
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          "$ANDROID_HOME"/build-tools/37.0.0/apksigner verify --print-certs "$APK" | head -5

      - name: Shred the keystore
        if: always()
        run: shred -u release.jks keystore.properties 2>/dev/null || rm -f release.jks keystore.properties

      - name: Attach the APK to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          APK=$(ls app/build/outputs/apk/release/*.apk | head -1)
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes "Signed release build." || true
          gh release upload "$GITHUB_REF_NAME" "$APK" --clobber
